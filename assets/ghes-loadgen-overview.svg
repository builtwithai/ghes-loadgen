<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">ghcr.io/builtwithai/ghes-loadgen Overview</title>
  <desc id="svg-desc">Three-stage overview: gated per-user access with expiring read:packages PAT, containerized non-production load runner with built-in safeguards and offline HTML reports, and single-node validation or multi-node cluster capacity runs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Outer container -->
  <rect x="1" y="1" width="1198" height="338" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Header bar -->
  <text x="36" y="48" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">ghcr.io/builtwithai/ghes-loadgen</text>
  <text x="36" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Repeatable GHES Load Generator · linux/amd64 Container · Non-Production Only</text>

  <!-- Status pills -->
  <rect x="850" y="28" width="148" height="28" rx="14" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-width="1"/>
  <text x="924" y="47" text-anchor="middle" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">ACCESS-GATED</text>

  <rect x="1010" y="28" width="154" height="28" rx="14" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-width="1"/>
  <text x="1087" y="47" text-anchor="middle" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">NON-PROD ONLY</text>

  <line x1="36" y1="94" x2="1164" y2="94" stroke="#21262d" stroke-width="1.5"/>

  <!-- Box 1: Gated Access -->
  <rect x="36" y="118" width="292" height="190" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="36" y="118" width="292" height="5" rx="2.5" fill="url(#accentBlue)"/>
  <text x="56" y="150" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">1. GATED ACCESS</text>
  <text x="56" y="176" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Per-User Expiring Pulls</text>
  <text x="56" y="206" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Zero-repo package Read grant</text>
  <text x="56" y="229" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• User expiring read:packages PAT</text>
  <text x="56" y="252" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Digest-pinned linux/amd64 image</text>
  <text x="56" y="275" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Revoked cleanly at closeout</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="328" y1="213" x2="386" y2="213" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Isolated Load Runner -->
  <rect x="394" y="118" width="336" height="190" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="394" y="118" width="336" height="5" rx="2.5" fill="url(#accentGreen)"/>
  <text x="414" y="150" fill="#56d364" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">2. CONTAINERIZED RUNNER</text>
  <text x="414" y="176" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Zero Baked Secrets, Hard Bounds</text>
  <text x="414" y="206" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• 8 real GHES workload families</text>
  <text x="414" y="229" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Reachability &amp; TLS pre-flight</text>
  <text x="414" y="252" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Hard-lease cutoff &amp; circuit break</text>
  <text x="414" y="275" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">• Self-contained offline HTML reports</text>

  <!-- Split Arrows 2 -> Single-Node & Multi-Node -->
  <path d="M 730 180 L 764 180 L 764 162 L 792 162" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 730 246 L 764 246 L 764 264 L 792 264" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3a: Single-Node & Staging -->
  <rect x="800" y="118" width="364" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="800" y="118" width="364" height="4" rx="2" fill="url(#accentBlue)"/>
  <text x="820" y="145" fill="#79c0ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">SINGLE-NODE &amp; STAGING</text>
  <text x="820" y="168" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Smoke Checks &amp; Workload Families</text>
  <text x="820" y="191" fill="#9ea7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Pre-upgrade sanity · Mixed traffic · Offline reports</text>

  <!-- Box 3b: Multi-Node Clusters -->
  <rect x="800" y="220" width="364" height="88" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="800" y="220" width="364" height="4" rx="2" fill="url(#accentPurple)"/>
  <text x="820" y="247" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">MULTI-NODE CLUSTERS</text>
  <text x="820" y="270" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">Even Node Split &amp; Ceiling Discovery</text>
  <text x="820" y="293" fill="#9ea7b3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Balanced split · Stepped ladders · Watchdog abort</text>
</svg>
