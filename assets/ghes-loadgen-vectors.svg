<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="title desc">
  <title id="title">ghes-loadgen — Workload Families</title>
  <desc id="desc">Eight GitHub Enterprise Server workload families and shaping modes covered by ghes-loadgen against non-production targets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .h1 { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .sub { font: 400 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; }
      .kicker { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.7px; }
      .cardTitle { font: 700 15.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
      .body { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .tag { font: 600 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="410" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="46" class="h1">What ghes-loadgen Exercises</text>
  <text x="36" y="69" class="sub">Real GitHub Enterprise Server workflows across 8 workload families · Strict non-production targets only</text>

  <!-- Legend pills -->
  <rect x="838" y="28" width="96" height="26" rx="13" fill="#13233a" stroke="#58a6ff" stroke-width="1.1"/>
  <text x="886" y="45" text-anchor="middle" class="tag" fill="#79c0ff">API &amp; WEB</text>

  <rect x="946" y="28" width="132" height="26" rx="13" fill="#2d1f0a" stroke="#d29922" stroke-width="1.1"/>
  <text x="1012" y="45" text-anchor="middle" class="tag" fill="#e3b341">GIT &amp; WORKFLOWS</text>

  <rect x="1090" y="28" width="74" height="26" rx="13" fill="#172c1d" stroke="#3fb950" stroke-width="1.1"/>
  <text x="1127" y="45" text-anchor="middle" class="tag" fill="#56d364">SHAPING</text>

  <line x1="36" y1="88" x2="1164" y2="88" stroke="#21262d" stroke-width="1"/>

  <!-- Row 1 (4 cards: x = 36, 322, 608, 894; width = 270; height = 136; gap = 16) -->
  <!-- Card 1: REST API -->
  <rect x="36" y="106" width="270" height="136" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="36" y="106" width="270" height="4" rx="2" fill="#58a6ff"/>
  <text x="52" y="131" class="kicker" fill="#79c0ff">01 · REST API</text>
  <text x="52" y="155" class="cardTitle">Core API &amp; Lifecycles</text>
  <text x="52" y="179" class="body">• Repo metadata, branches, tags</text>
  <text x="52" y="199" class="body">• Issues, PRs, reviews &amp; merges</text>
  <text x="52" y="219" class="body">• Search, notifications, webhooks</text>

  <!-- Card 2: GraphQL -->
  <rect x="322" y="106" width="270" height="136" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="322" y="106" width="270" height="4" rx="2" fill="#58a6ff"/>
  <text x="338" y="131" class="kicker" fill="#79c0ff">02 · GRAPHQL</text>
  <text x="338" y="155" class="cardTitle">Queries &amp; Mutations</text>
  <text x="338" y="179" class="body">• Authenticated issue graph queries</text>
  <text x="338" y="199" class="body">• Paired REST + GraphQL fixtures</text>
  <text x="338" y="219" class="body">• Org Projects v2 mutations</text>

  <!-- Card 3: Git & LFS -->
  <rect x="608" y="106" width="270" height="136" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="608" y="106" width="270" height="4" rx="2" fill="#d29922"/>
  <text x="624" y="131" class="kicker" fill="#e3b341">03 · GIT &amp; LFS</text>
  <text x="624" y="155" class="cardTitle">Clones, Fetches &amp; Pushes</text>
  <text x="624" y="179" class="body">• Full, shallow &amp; partial clones</text>
  <text x="624" y="199" class="body">• HTTPS and SSH transport paths</text>
  <text x="624" y="219" class="body">• Size-capped Git LFS uploads</text>

  <!-- Card 4: Web UI & Search -->
  <rect x="894" y="106" width="270" height="136" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="894" y="106" width="270" height="4" rx="2" fill="#58a6ff"/>
  <text x="910" y="131" class="kicker" fill="#79c0ff">04 · WEB UI &amp; SEARCH</text>
  <text x="910" y="155" class="cardTitle">Browser Flows &amp; Queries</text>
  <text x="910" y="179" class="body">• /status &amp; archive downloads</text>
  <text x="910" y="199" class="body">• Commit history &amp; web search</text>
  <text x="910" y="219" class="body">• Interactive browser writes</text>

  <!-- Row 2 (4 cards: y = 256, height = 132) -->
  <!-- Card 5: Projects v2 -->
  <rect x="36" y="256" width="270" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="36" y="256" width="270" height="4" rx="2" fill="#d29922"/>
  <text x="52" y="281" class="kicker" fill="#e3b341">05 · PROJECTS V2</text>
  <text x="52" y="305" class="cardTitle">Planning Boards at Scale</text>
  <text x="52" y="329" class="body">• Org project creation flows</text>
  <text x="52" y="349" class="body">• Adding issues to boards</text>
  <text x="52" y="369" class="body">• GHES 3.18+ write concurrency</text>

  <!-- Card 6: Code Scanning -->
  <rect x="322" y="256" width="270" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="322" y="256" width="270" height="4" rx="2" fill="#d29922"/>
  <text x="338" y="281" class="kicker" fill="#e3b341">06 · CODE SCANNING</text>
  <text x="338" y="305" class="cardTitle">SARIF Upload Bursts</text>
  <text x="338" y="329" class="body">• Small, medium &amp; large payloads</text>
  <text x="338" y="349" class="body">• Upload acceptance &amp; latency</text>
  <text x="338" y="369" class="body">• Concurrent scan ingestion</text>

  <!-- Card 7: Actions & Deployments -->
  <rect x="608" y="256" width="270" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="608" y="256" width="270" height="4" rx="2" fill="#d29922"/>
  <text x="624" y="281" class="kicker" fill="#e3b341">07 · ACTIONS &amp; DEPLOYS</text>
  <text x="624" y="305" class="cardTitle">Automation &amp; Triggers</text>
  <text x="624" y="329" class="body">• Throttled workflow dispatches</text>
  <text x="624" y="349" class="body">• Warmup &amp; repo dispatch events</text>
  <text x="624" y="369" class="body">• Deployment status bursts</text>

  <!-- Card 8: Workload Shaping -->
  <rect x="894" y="256" width="270" height="132" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <rect x="894" y="256" width="270" height="4" rx="2" fill="#3fb950"/>
  <text x="910" y="281" class="kicker" fill="#56d364">08 · LOAD SHAPING</text>
  <text x="910" y="305" class="cardTitle">Controlled Test Profiles</text>
  <text x="910" y="329" class="body">• 1-pass read-only smoke checks</text>
  <text x="910" y="349" class="body">• Isolated bursts &amp; stepped ladders</text>
  <text x="910" y="369" class="body">• Auto circuit-break &amp; hard lease</text>
</svg>
